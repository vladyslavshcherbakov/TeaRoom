name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Type-check and run the tests
        run: Scripts/test.sh

  ui-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ui-test-${{ matrix.project }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: iphone-webkit
            browser: webkit
          - project: android-chromium
            browser: chromium
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Find the revision of the browser for the UI tests
        id: browser-revision
        run: |
          revision=$(node -e "
            const { browsers } = JSON.parse(require('fs').readFileSync('node_modules/playwright-core/browsers.json', 'utf8'))
            console.log(browsers.filter((browser) => browser.installByDefault && browser.name.startsWith(process.argv[1])).map((browser) => browser.name + '-' + browser.revision).join('-'))
          " ${{ matrix.browser }})
          echo "Playwright installs $revision for ${{ matrix.browser }}"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Restore the browser for the UI tests
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browser-revision.outputs.revision }}
      - name: Install the browser for the UI tests
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install the system libraries of the restored browser
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Build the site and run the UI tests on ${{ matrix.project }}
        run: Scripts/test-ui.sh --project=${{ matrix.project }}
      - name: Upload the traces and screenshots of the failed UI tests on ${{ matrix.project }}
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-ui-tests-${{ matrix.project }}
          path: test-results/

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Build the site
        run: Scripts/build.sh
      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [test, ui-test, build]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
