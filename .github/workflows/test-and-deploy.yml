name: Test and deploy

on:
  push:
    paths-ignore: &changesThatLeaveTheGameAsItIs
      - '**.md'
      - '.gitignore'
      - '.claude/**'
      - 'Scripts/build-artifact.sh'
      - 'Scripts/assemble-artifact-page.mjs'
      - 'Scripts/silent-build.vite.config.mjs'
  pull_request:
    paths-ignore: *changesThatLeaveTheGameAsItIs
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/merge-the-open-pull-requests-base
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Type-check and run the tests
        run: Scripts/test.sh

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/merge-the-open-pull-requests-base
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Build the site
        run: Scripts/build.sh
      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [test, build]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
