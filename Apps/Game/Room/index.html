<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6e9d6" />
    <title>Tea Room — the room</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6e9d6;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #room {
        position: fixed;
        inset: 0;
      }
      .sip {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        min-width: 96px;
        min-height: 48px;
        padding: 0 20px;
        border: 2px solid #3f6f57;
        border-radius: 24px;
        background: #5f9a7c;
        color: #fbf4e8;
        font: 600 16px/1 system-ui, sans-serif;
      }
      .sip[hidden] {
        display: none;
      }
      .caption {
        position: fixed;
        bottom: calc(28vh + env(safe-area-inset-bottom));
        left: 16px;
        right: 16px;
        padding: 12px 16px;
        border-radius: 16px;
        background: rgba(251, 244, 232, 0.92);
        color: #5a3a26;
        font: 15px/1.4 system-ui, sans-serif;
        white-space: pre-line;
        text-align: center;
        pointer-events: none;
      }
      .caption[hidden] {
        display: none;
      }
      .quiet {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #5a3a26;
        font: 16px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="room"></div>
    <script type="module" src="./RoomMain.ts"></script>
  </body>
</html>
