<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6e9d6" />
    <title>Tea Room — the room</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6e9d6;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #room {
        position: fixed;
        inset: 0;
      }
      .sip {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        min-width: 96px;
        min-height: 48px;
        padding: 0 20px;
        border: 2px solid #3f6f57;
        border-radius: 24px;
        background: #5f9a7c;
        color: #fbf4e8;
        font: 600 16px/1 system-ui, sans-serif;
      }
      .sip[hidden] {
        display: none;
      }
      .tilt {
        position: fixed;
        right: 24px;
        bottom: calc(24px + env(safe-area-inset-bottom));
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 2px solid #8f5a3a;
        background: #fbf4e8;
        font-size: 40px;
        touch-action: none;
      }
      .tilt[hidden] {
        display: none;
      }
      .aim-hint {
        position: fixed;
        left: 16px;
        right: 128px;
        bottom: calc(24px + env(safe-area-inset-bottom));
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(251, 244, 232, 0.94);
        color: #5a3a26;
        font: 15px/1.4 system-ui, sans-serif;
        pointer-events: none;
      }
      .aim-hint[hidden] {
        display: none;
      }
      .caption {
        position: fixed;
        bottom: calc(28vh + env(safe-area-inset-bottom));
        left: 16px;
        right: 16px;
        padding: 12px 16px;
        border-radius: 16px;
        background: rgba(251, 244, 232, 0.92);
        color: #5a3a26;
        font: 15px/1.4 system-ui, sans-serif;
        white-space: pre-line;
        text-align: center;
        pointer-events: none;
      }
      .caption[hidden] {
        display: none;
      }
      .stick {
        position: fixed;
        bottom: calc(28px + env(safe-area-inset-bottom));
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 2px solid rgba(143, 90, 58, 0.6);
        background: rgba(251, 244, 232, 0.35);
        touch-action: none;
        display: grid;
        place-items: center;
      }
      .stick.left {
        left: 24px;
      }
      .stick.right {
        right: 24px;
      }
      .stick[hidden] {
        display: none;
      }
      .stick-knob {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(251, 244, 232, 0.9);
        border: 2px solid #8f5a3a;
        pointer-events: none;
      }
      .debug-menu {
        position: fixed;
        top: calc(16px + env(safe-area-inset-top));
        left: 16px;
        right: 16px;
        padding: 16px;
        border-radius: 16px;
        background: rgba(251, 244, 232, 0.97);
        color: #5a3a26;
        font: 15px/1.4 system-ui, sans-serif;
        display: grid;
        gap: 8px;
      }
      .debug-menu[hidden] {
        display: none;
      }
      .debug-menu h2 {
        margin: 0;
        font-size: 18px;
      }
      .debug-menu p {
        margin: 0;
      }
      .debug-choice,
      .debug-close {
        min-height: 44px;
        border-radius: 12px;
        border: 2px solid #8f5a3a;
        background: #fbf4e8;
        color: #5a3a26;
        font: 600 15px/1 system-ui, sans-serif;
      }
      .debug-choice[aria-pressed='true'] {
        background: #5f9a7c;
        border-color: #3f6f57;
        color: #fbf4e8;
      }
      .you-died {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 40px;
        background: rgba(0, 0, 0, 0.65);
        opacity: 0;
        transition: opacity 2.5s ease-in;
      }
      .you-died[hidden] {
        display: none;
      }
      .you-died.is-shown {
        opacity: 1;
      }
      .you-died-band {
        width: 100%;
        padding: 32px 0;
        background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.85) 30%, rgba(0, 0, 0, 0.85) 70%, transparent);
        text-align: center;
      }
      .you-died-title {
        margin: 0;
        color: #9b1b1b;
        font: 400 clamp(44px, 14vw, 96px) / 1 'Times New Roman', Georgia, serif;
        letter-spacing: 0.12em;
        transform: scale(0.94);
        transition: transform 5s ease-out;
      }
      .you-died.is-shown .you-died-title {
        transform: scale(1.04);
      }
      .you-died-last-words {
        margin: 18px 16px 0;
        color: #b3322c;
        font: italic 400 clamp(17px, 4.6vw, 26px) / 1.3 'Times New Roman', Georgia, serif;
        letter-spacing: 0.04em;
        opacity: 0;
        transition: opacity 1.5s ease-in 1.5s;
      }
      .you-died-obituary {
        max-width: 34em;
        margin: 0 24px;
        color: #d8c9a3;
        font: 400 clamp(15px, 4vw, 19px) / 1.45 'Times New Roman', Georgia, serif;
        text-align: center;
        opacity: 0;
        transition: opacity 1.5s ease-in 2.5s;
      }
      .you-died.is-shown .you-died-last-words,
      .you-died.is-shown .you-died-obituary {
        opacity: 1;
      }
      .you-died-restart {
        min-height: 44px;
        padding: 0 28px;
        border: 1px solid #7d6d4f;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.7);
        color: #d8c9a3;
        font: 17px/1 'Times New Roman', Georgia, serif;
        letter-spacing: 0.1em;
        opacity: 0;
        transition: opacity 1.5s ease-in 4s;
      }
      .you-died.is-shown .you-died-restart {
        opacity: 1;
      }
      .quiet {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #5a3a26;
        font: 16px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="room"></div>
    <script type="module" src="./RoomMain.ts"></script>
  </body>
</html>
