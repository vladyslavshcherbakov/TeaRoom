<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6e9d6" />
    <title>Tea Room — the room</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6e9d6;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #room {
        position: fixed;
        inset: 0;
      }
      .sip {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        min-width: 96px;
        min-height: 48px;
        padding: 0 20px;
        border: 2px solid #3f6f57;
        border-radius: 24px;
        background: #5f9a7c;
        color: #fbf4e8;
        font: 600 16px/1 system-ui, sans-serif;
      }
      .sip[hidden] {
        display: none;
      }
      .tilt {
        position: fixed;
        right: 24px;
        bottom: calc(24px + env(safe-area-inset-bottom));
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 2px solid #8f5a3a;
        background: #fbf4e8;
        font-size: 40px;
        touch-action: none;
      }
      .tilt[hidden] {
        display: none;
      }
      .aim-hint {
        position: fixed;
        left: 16px;
        right: 128px;
        bottom: calc(24px + env(safe-area-inset-bottom));
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(251, 244, 232, 0.94);
        color: #5a3a26;
        font: 15px/1.4 system-ui, sans-serif;
        pointer-events: none;
      }
      .aim-hint[hidden] {
        display: none;
      }
      .caption {
        position: fixed;
        bottom: calc(28vh + env(safe-area-inset-bottom));
        left: 16px;
        right: 16px;
        padding: 12px 16px;
        border-radius: 16px;
        background: rgba(251, 244, 232, 0.92);
        color: #5a3a26;
        font: 15px/1.4 system-ui, sans-serif;
        white-space: pre-line;
        text-align: center;
        pointer-events: none;
      }
      .caption[hidden] {
        display: none;
      }
      .stick {
        position: fixed;
        bottom: calc(28px + env(safe-area-inset-bottom));
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 2px solid rgba(143, 90, 58, 0.6);
        background: rgba(251, 244, 232, 0.35);
        touch-action: none;
        display: grid;
        place-items: center;
      }
      .stick.walk {
        left: 24px;
      }
      .stick.look {
        right: 24px;
      }
      .stick[hidden] {
        display: none;
      }
      .stick-knob {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(251, 244, 232, 0.9);
        border: 2px solid #8f5a3a;
        pointer-events: none;
      }
      .debug-menu {
        position: fixed;
        top: calc(16px + env(safe-area-inset-top));
        left: 16px;
        right: 16px;
        padding: 16px;
        border-radius: 16px;
        background: rgba(251, 244, 232, 0.97);
        color: #5a3a26;
        font: 15px/1.4 system-ui, sans-serif;
        display: grid;
        gap: 8px;
      }
      .debug-menu[hidden] {
        display: none;
      }
      .debug-menu h2 {
        margin: 0;
        font-size: 18px;
      }
      .debug-menu p {
        margin: 0;
      }
      .debug-choice,
      .debug-close {
        min-height: 44px;
        border-radius: 12px;
        border: 2px solid #8f5a3a;
        background: #fbf4e8;
        color: #5a3a26;
        font: 600 15px/1 system-ui, sans-serif;
      }
      .debug-choice[aria-pressed='true'] {
        background: #5f9a7c;
        border-color: #3f6f57;
        color: #fbf4e8;
      }
      .quiet {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #5a3a26;
        font: 16px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="room"></div>
    <script type="module" src="./RoomMain.ts"></script>
  </body>
</html>
