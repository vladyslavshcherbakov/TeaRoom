<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6e9d6" />
    <title>TeaCeremony</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6e9d6;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #room {
        position: fixed;
        inset: 0;
      }
      .sip {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        min-width: 96px;
        min-height: 48px;
        padding: 0 20px;
        border: 2px solid #3f6f57;
        border-radius: 24px;
        background: #5f9a7c;
        color: #fbf4e8;
        font: 600 16px/1 system-ui, sans-serif;
      }
      .sip[hidden] {
        display: none;
      }
      .tilt {
        position: fixed;
        right: 24px;
        bottom: calc(24px + env(safe-area-inset-bottom));
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 2px solid #8f5a3a;
        background: #fbf4e8;
        font-size: 40px;
        touch-action: none;
      }
      .tilt[hidden] {
        display: none;
      }
      .aim-hint {
        position: fixed;
        left: 16px;
        right: 128px;
        bottom: calc(24px + env(safe-area-inset-bottom));
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(251, 244, 232, 0.94);
        color: #5a3a26;
        font: 15px/1.4 system-ui, sans-serif;
        pointer-events: none;
      }
      .aim-hint[hidden] {
        display: none;
      }
      .caption {
        position: fixed;
        bottom: calc(28vh + env(safe-area-inset-bottom));
        left: 16px;
        right: 16px;
        padding: 12px 16px;
        border-radius: 16px;
        background: rgba(251, 244, 232, 0.92);
        color: #5a3a26;
        font: 15px/1.4 system-ui, sans-serif;
        white-space: pre-line;
        text-align: center;
        cursor: pointer;
      }
      .caption[hidden] {
        display: none;
      }
      .stick {
        position: fixed;
        bottom: calc(28px + env(safe-area-inset-bottom));
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 2px solid rgba(143, 90, 58, 0.6);
        background: rgba(251, 244, 232, 0.35);
        touch-action: none;
        display: grid;
        place-items: center;
      }
      .stick.left {
        left: 24px;
      }
      .stick.right {
        right: 24px;
      }
      .stick[hidden] {
        display: none;
      }
      .stick-knob {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(251, 244, 232, 0.9);
        border: 2px solid #8f5a3a;
        pointer-events: none;
      }
      .debug-menu {
        position: fixed;
        top: calc(16px + env(safe-area-inset-top));
        left: 16px;
        right: 16px;
        padding: 16px;
        border-radius: 16px;
        background: rgba(251, 244, 232, 0.97);
        color: #5a3a26;
        font: 15px/1.4 system-ui, sans-serif;
        display: grid;
        gap: 8px;
      }
      .debug-menu[hidden] {
        display: none;
      }
      .debug-menu h2 {
        margin: 0;
        font-size: 18px;
      }
      .debug-menu p {
        margin: 0;
      }
      .debug-choice,
      .debug-close {
        min-height: 44px;
        border-radius: 12px;
        border: 2px solid #8f5a3a;
        background: #fbf4e8;
        color: #5a3a26;
        font: 600 15px/1 system-ui, sans-serif;
      }
      .debug-choice[aria-pressed='true'] {
        background: #5f9a7c;
        border-color: #3f6f57;
        color: #fbf4e8;
      }
      .you-died {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 40px;
        background: rgba(0, 0, 0, 0.65);
        opacity: 0;
        transition: opacity 2.5s ease-in;
      }
      .you-died[hidden] {
        display: none;
      }
      .you-died.is-shown {
        opacity: 1;
      }
      .you-died-band {
        width: 100%;
        padding: 32px 0;
        background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.85) 30%, rgba(0, 0, 0, 0.85) 70%, transparent);
        text-align: center;
      }
      .you-died-title {
        margin: 0;
        color: #9b1b1b;
        font: 400 clamp(44px, 14vw, 96px) / 1 'Times New Roman', Georgia, serif;
        letter-spacing: 0.12em;
        transform: scale(0.94);
        transition: transform 5s ease-out;
      }
      .you-died.is-shown .you-died-title {
        transform: scale(1.04);
      }
      .you-died-last-words {
        margin: 18px 16px 0;
        color: #b3322c;
        font: italic 400 clamp(17px, 4.6vw, 26px) / 1.3 'Times New Roman', Georgia, serif;
        letter-spacing: 0.04em;
        opacity: 0;
        transition: opacity 1.5s ease-in 1.5s;
      }
      .you-died-obituary {
        max-width: 34em;
        margin: 0 24px;
        color: #d8c9a3;
        font: 400 clamp(15px, 4vw, 19px) / 1.45 'Times New Roman', Georgia, serif;
        text-align: center;
        opacity: 0;
        transition: opacity 1.5s ease-in 2.5s;
      }
      .you-died.is-shown .you-died-last-words,
      .you-died.is-shown .you-died-obituary {
        opacity: 1;
      }
      .you-died-restart {
        min-height: 44px;
        padding: 0 28px;
        border: 1px solid #7d6d4f;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.7);
        color: #d8c9a3;
        font: 17px/1 'Times New Roman', Georgia, serif;
        letter-spacing: 0.1em;
        opacity: 0;
        transition: opacity 1.5s ease-in 4s;
      }
      .you-died.is-shown .you-died-restart {
        opacity: 1;
      }
      .continue {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 16px;
        padding: 0 16px;
        background: #f6e9d6;
      }
      .continue-title {
        max-width: 24em;
        margin: 0 0 16px;
        color: #5a3a26;
        font: 18px/1.4 system-ui, sans-serif;
        text-align: center;
      }
      .continue-primary,
      .continue-secondary {
        min-width: 200px;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 24px;
        font: 600 16px/1 system-ui, sans-serif;
      }
      .continue-primary {
        border: 2px solid #3f6f57;
        background: #5f9a7c;
        color: #fbf4e8;
      }
      .continue-secondary {
        border: 2px solid #8f5a3a;
        background: #fbf4e8;
        color: #5a3a26;
      }
      .settings {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(40, 26, 16, 0.45);
      }
      .settings[hidden] {
        display: none;
      }
      .settings-sheet {
        display: grid;
        gap: 10px;
        width: min(360px, 100%);
        padding: 20px;
        border-radius: 4px;
        background: #fbf4e8;
        box-shadow: 0 8px 24px rgba(40, 26, 16, 0.35);
        color: #5a3a26;
        font: 15px/1.35 system-ui, sans-serif;
      }
      .settings-sheet h2 {
        margin: 0;
        font: 600 18px/1.2 system-ui, sans-serif;
      }
      .settings-sheet h3 {
        margin: 6px 0 0;
        font: 600 14px/1.2 system-ui, sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #8a6d57;
      }
      .settings-palette {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .settings-swatch {
        aspect-ratio: 1;
        border: 3px solid transparent;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(40, 26, 16, 0.2);
      }
      .settings-swatch[aria-pressed='true'] {
        border-color: #5a3a26;
      }
      .settings-toggle {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 40px;
        font-weight: 600;
      }
      .settings-toggle input {
        width: 22px;
        height: 22px;
        accent-color: #5f9a7c;
      }
      .settings-warning {
        margin: 0;
        font-size: 13px;
        color: #9a3f2f;
      }
      .settings-close {
        justify-self: end;
        min-height: 40px;
        padding: 0 16px;
        border: 2px solid #3f6f57;
        border-radius: 20px;
        background: #5f9a7c;
        color: #fbf4e8;
        font: 600 14px/1 system-ui, sans-serif;
      }
      .achievements {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(40, 26, 16, 0.45);
      }
      .achievements[hidden] {
        display: none;
      }
      .achievements-sheet {
        width: min(360px, 100%);
        max-height: 100%;
        overflow-y: auto;
        padding: 20px 20px 16px;
        border-radius: 4px;
        background: #fbf4e8;
        box-shadow: 0 8px 24px rgba(40, 26, 16, 0.35);
        color: #5a3a26;
        font: 15px/1.35 system-ui, sans-serif;
      }
      .achievements-title {
        margin: 0 0 12px;
        font: 600 18px/1.2 system-ui, sans-serif;
      }
      .achievements-items {
        display: grid;
        gap: 10px;
        margin: 0 0 16px;
        padding: 0;
        list-style: none;
      }
      .achievement {
        display: grid;
        gap: 2px;
        padding-left: 24px;
        position: relative;
      }
      .achievement::before {
        content: '○';
        position: absolute;
        left: 0;
        color: #b59a7e;
      }
      .achievement.is-unlocked::before {
        content: '✓';
        color: #3f6f57;
        font-weight: 700;
      }
      .achievement.is-unlocked .achievement-title {
        text-decoration: line-through;
        color: #8a6d57;
      }
      .achievement-done {
        font-size: 13px;
        color: #7a5a44;
      }
      .achievements-buttons {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .achievements-reset,
      .achievements-close {
        min-height: 40px;
        padding: 0 16px;
        border-radius: 20px;
        font: 600 14px/1 system-ui, sans-serif;
      }
      .achievements-reset {
        border: 2px solid #b0513f;
        background: #fbf4e8;
        color: #9a3f2f;
      }
      .achievements-close {
        border: 2px solid #3f6f57;
        background: #5f9a7c;
        color: #fbf4e8;
      }
      .frame-rate {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        left: calc(8px + env(safe-area-inset-left));
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(40, 26, 16, 0.55);
        color: #fbf4e8;
        font: 600 12px/1.4 ui-monospace, monospace;
        pointer-events: none;
      }
      .frame-rate[hidden] {
        display: none;
      }
      .achievement-notice {
        position: fixed;
        top: calc(16px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 10px 18px;
        border-radius: 20px;
        background: rgba(251, 244, 232, 0.95);
        color: #5a3a26;
        font: 600 15px/1.3 system-ui, sans-serif;
        box-shadow: 0 4px 12px rgba(40, 26, 16, 0.25);
        pointer-events: none;
        z-index: 1;
      }
      .achievement-notice[hidden] {
        display: none;
      }
      .quiet {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #5a3a26;
        font: 16px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="room"></div>
    <script type="module" src="./RoomMain.ts"></script>
  </body>
</html>
