<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6e9d6" />
    <title>Tea Room — the room</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6e9d6;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #room {
        position: fixed;
        inset: 0;
      }
      .hands {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(16px + env(safe-area-inset-bottom));
        display: flex;
        justify-content: space-between;
        padding: 0 16px;
        pointer-events: none;
      }
      .hands button {
        pointer-events: auto;
        min-width: 120px;
        min-height: 48px;
        padding: 0 16px;
        border: 2px solid #8f5a3a;
        border-radius: 24px;
        background: #fbf4e8;
        color: #5a3a26;
        font: 600 16px/1 system-ui, sans-serif;
      }
      .hands button:disabled {
        opacity: 0.5;
        border-style: dashed;
      }
      .hands button.chosen {
        background: #8f5a3a;
        color: #fbf4e8;
      }
      .quiet {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #5a3a26;
        font: 16px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="room"></div>
    <script type="module" src="./RoomMain.ts"></script>
  </body>
</html>
