<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tea Room — Ritual Bench</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f4efe6;
        --ink: #2b2620;
        --muted: #7a6f62;
        --line: #d8cfc1;
        --accent: #8a5a2b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #1d1a17;
          --ink: #ece4d8;
          --muted: #a0968a;
          --line: #3a342d;
          --accent: #d9a066;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.4 -apple-system, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.note { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
      section { border-top: 1px solid var(--line); padding: 10px 0; }
      h2 { font-size: 14px; margin: 0 0 6px; color: var(--accent); }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
      .readout { font-variant-numeric: tabular-nums; color: var(--muted); }
      button, select {
        font: inherit;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
      }
      button:active { background: var(--line); }
      button.hold { border-color: var(--accent); }
      input[type='range'] { flex: 1; min-width: 120px; }
      #log { font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>Tea Room — ritual bench</h1>
    <p class="note">A debug page over the simulation core (v0.1). No art, no sound: every control sends one command.</p>
    <main id="bench"></main>
    <script type="module" src="./Bench.ts"></script>
  </body>
</html>
